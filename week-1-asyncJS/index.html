<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>100xDevs — JS Foundations & Async Engineering Companion</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-beige: #F6F3EB;
      --bg-card: #EFECE3;
      --bg-elevated: #E6E1D5;
      --ink-black: #121212;
      --ink-muted: #52504C;
    }

    body {
      background-color: var(--bg-beige);
      color: var(--ink-black);
      font-family: 'Inter', sans-serif;
    }

    .serif-title {
      font-family: 'Instrument Serif', Georgia, serif;
    }

    code, pre, .mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Editorial brutalist-lite borders & shadows */
    .editorial-card {
      background-color: var(--bg-card);
      border: 1.5px solid var(--ink-black);
      box-shadow: 4px 4px 0px var(--ink-black);
    }

    .editorial-card-sm {
      background-color: var(--bg-card);
      border: 1px solid var(--ink-black);
      box-shadow: 2px 2px 0px var(--ink-black);
    }

    .editorial-btn {
      border: 1.5px solid var(--ink-black);
      box-shadow: 2px 2px 0px var(--ink-black);
      transition: all 0.15s ease;
    }

    .editorial-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0px var(--ink-black);
    }

    .editorial-btn:active {
      transform: translate(1px, 1px);
      box-shadow: 0px 0px 0px var(--ink-black);
    }

    .nav-active {
      background-color: var(--ink-black) !important;
      color: var(--bg-beige) !important;
      font-weight: 600;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #EAE5D9;
    }
    ::-webkit-scrollbar-thumb {
      background: #121212;
      border-radius: 3px;
    }

    @keyframes popIn {
      0% { transform: scale(0.95); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop {
      animation: popIn 0.2s ease-out forwards;
    }
  </style>
</head>

<body class="min-h-screen flex flex-col lg:flex-row selection:bg-[#121212] selection:text-[#F6F3EB]">

  <!-- MOBILE HEADER -->
  <header class="lg:hidden flex items-center justify-between px-5 py-4 border-b-2 border-[#121212] bg-[#EFECE3] sticky top-0 z-30">
    <div>
      <span class="text-[11px] mono uppercase tracking-widest px-2 py-0.5 bg-[#121212] text-[#F6F3EB] rounded">100xDevs • Harkirat</span>
      <h1 class="serif-title text-2xl leading-none mt-1">JS & Async Interactive Notes</h1>
    </div>
    <button onclick="toggleMobileMenu()" class="editorial-btn bg-[#F6F3EB] px-3 py-1.5 rounded text-xs mono font-semibold">
      ☰ Modules
    </button>
  </header>

  <!-- LEFT SIDEBAR NAVIGATION -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-80 bg-[#EFECE3] border-r-2 border-[#121212] flex flex-col transform -translate-x-full lg:translate-x-0 lg:static transition-transform duration-200 ease-in-out shrink-0">
    <!-- Brand Header -->
    <div class="p-6 border-b-2 border-[#121212]">
      <div class="flex items-center justify-between">
        <span class="px-2.5 py-0.5 text-[11px] font-bold bg-[#121212] text-[#F6F3EB] rounded-full mono uppercase tracking-wider">100xDevs Cohort</span>
        <span class="text-xs mono text-[#52504C]">Oct 20, 2026</span>
      </div>
      <h1 class="serif-title text-3xl text-[#121212] mt-3 leading-tight">Interactive Field Manual</h1>
      <p class="text-xs text-[#52504C] mt-1">Instructor: Harkirat Singh • Complete 8-File Study Edition</p>
      
      <!-- Search Bar -->
      <div class="mt-4 relative">
        <input 
          type="text" 
          id="topic-search" 
          oninput="filterNavigation(this.value)"
          placeholder="Filter notes (e.g. GIL, Promise, I/O)..." 
          class="w-full bg-[#F6F3EB] border border-[#121212] rounded-lg px-3 py-1.5 text-xs mono placeholder-[#52504C] focus:outline-none focus:ring-2 focus:ring-[#121212]"
        />
      </div>
    </div>

    <!-- Navigation List -->
    <nav class="flex-1 overflow-y-auto p-4 space-y-6" id="nav-container">
      <!-- Section 1: JS 101 Foundations -->
      <div class="nav-group">
        <div class="px-2 pb-1.5 text-[11px] font-bold uppercase tracking-widest text-[#52504C] mono border-b border-[#121212]/20">
          Part I • JS 101 Foundations
        </div>
        <div class="mt-2 space-y-1.5">
          <button onclick="switchModule('js-properties')" id="btn-js-properties" class="nav-btn w-full text-left px-3 py-2.5 rounded-lg text-xs font-medium hover:bg-[#E6E1D5] transition flex items-center justify-between">
            <span>1. Properties of JS & Runtimes</span>
            <span class="mono text-[10px] opacity-70">01</span>
          </button>
          <button onclick="switchModule('complex-types')" id="btn-complex-types" class="nav-btn w-full text-left px-3 py-2.5 rounded-lg text-xs font-medium hover:bg-[#E6E1D5] transition flex items-center justify-between">
            <span>2. Complex Types & 5 Assignments</span>
            <span class="mono text-[10px] px-1.5 py-0.5 bg-[#121212]/10 rounded">LAB</span>
          </button>
          <button onclick="switchModule('sync-cpu-io')" id="btn-sync-cpu-io" class="nav-btn w-full text-left px-3 py-2.5 rounded-lg text-xs font-medium hover:bg-[#E6E1D5] transition flex items-center justify-between">
            <span>3. Sync Code & CPU vs I/O Tasks</span>
            <span class="mono text-[10px] opacity-70">03</span>
          </button>
        </div>
      </div>

      <!-- Section 2: Winter Camp Class 1 -->
      <div class="nav-group">
        <div class="px-2 pb-1.5 text-[11px] font-bold uppercase tracking-widest text-[#52504C] mono border-b border-[#121212]/20">
          Part II • Winter Camp Class 1
        </div>
        <div class="mt-2 space-y-1.5">
          <button onclick="switchModule('event-loop-arch')" id="btn-event-loop-arch" class="nav-btn w-full text-left px-3 py-2.5 rounded-lg text-xs font-medium hover:bg-[#E6E1D5] transition flex items-center justify-between">
            <span>4. JS Async Architecture & Loupe</span>
            <span class="mono text-[10px] px-1.5 py-0.5 bg-[#121212]/10 rounded">SIM</span>
          </button>
          <button onclick="switchModule('callbacks-deep')" id="btn-callbacks-deep" class="nav-btn w-full text-left px-3 py-2.5 rounded-lg text-xs font-medium hover:bg-[#E6E1D5] transition flex items-center justify-between">
            <span>5. Callbacks & Concurrent File Sync</span>
            <span class="mono text-[10px] px-1.5 py-0.5 bg-[#121212]/10 rounded">SIM</span>
          </button>
        </div>
      </div>

      <!-- Section 3: Winter Camp Class 2 -->
      <div class="nav-group">
        <div class="px-2 pb-1.5 text-[11px] font-bold uppercase tracking-widest text-[#52504C] mono border-b border-[#121212]/20">
          Part III • Winter Camp Class 2
        </div>
        <div class="mt-2 space-y-1.5">
          <button onclick="switchModule('promises-chaining')" id="btn-promises-chaining" class="nav-btn w-full text-left px-3 py-2.5 rounded-lg text-xs font-medium hover:bg-[#E6E1D5] transition flex items-center justify-between">
            <span>6. Promises, States & Promisification</span>
            <span class="mono text-[10px] px-1.5 py-0.5 bg-[#121212]/10 rounded">SIM</span>
          </button>
          <button onclick="switchModule('async-await-gist')" id="btn-async-await-gist" class="nav-btn w-full text-left px-3 py-2.5 rounded-lg text-xs font-medium hover:bg-[#E6E1D5] transition flex items-center justify-between">
            <span>7. Async/Await & Gist Code Fixes</span>
            <span class="mono text-[10px] opacity-70">07</span>
          </button>
          <button onclick="switchModule('multithreading-glossary')" id="btn-multithreading-glossary" class="nav-btn w-full text-left px-3 py-2.5 rounded-lg text-xs font-medium hover:bg-[#E6E1D5] transition flex items-center justify-between">
            <span>8. Multithreading (JS/Py/Rust) & Glossary</span>
            <span class="mono text-[10px] opacity-70">08</span>
          </button>
          <button onclick="switchModule('wispr-practice')" id="btn-wispr-practice" class="nav-btn w-full text-left px-3 py-2.5 rounded-lg text-xs font-medium hover:bg-[#E6E1D5] transition flex items-center justify-between">
            <span>9. Wispr Summaries & Checkpoints</span>
            <span class="mono text-[10px] px-1.5 py-0.5 bg-[#121212]/10 rounded">QUIZ</span>
          </button>
        </div>
      </div>
    </nav>

    <!-- Progress Footer -->
    <div class="p-4 border-t-2 border-[#121212] bg-[#E6E1D5]">
      <div class="flex items-center justify-between text-xs mono mb-1.5">
        <span class="font-semibold">MASTERY CHECKLIST</span>
        <span id="mastery-score" class="font-bold">0 / 11</span>
      </div>
      <div class="w-full h-2 bg-[#F6F3EB] border border-[#121212] rounded-full overflow-hidden">
        <div id="mastery-bar" class="h-full bg-[#121212] w-0 transition-all duration-300"></div>
      </div>
    </div>
  </aside>

  <!-- MAIN CONTENT WORKSPACE -->
  <main class="flex-1 overflow-y-auto px-5 py-8 lg:px-14 lg:py-12">
    <div id="content-mount" class="max-w-4xl mx-auto"></div>
  </main>

  <script>
    // Global State for Checkpoints & Interactive Widgets
    const appState = {
      currentModule: 'js-properties',
      quizAnswered: {},
      checklistItems: {
        c1: false, c2: false, c3: false, c4: false, c5: false, c6: false
      },
      promiseState: 'pending',
      promiseValue: 'Waiting for order...',
      fileRaceStep: 0,
      eventLoopMode: 'timeout',
      eventLoopStep: 0
    };

    function updateMasteryUI() {
      const quizCount = Object.values(appState.quizAnswered).filter(Boolean).length;
      const checkCount = Object.values(appState.checklistItems).filter(Boolean).length;
      const total = quizCount + checkCount;
      document.getElementById('mastery-score').innerText = `${total} / 11`;
      document.getElementById('mastery-bar').style.width = `${Math.min(100, (total / 11) * 100)}%`;
    }

    function toggleMobileMenu() {
      const sb = document.getElementById('sidebar');
      sb.classList.toggle('-translate-x-full');
    }

    function filterNavigation(query) {
      const q = query.toLowerCase().trim();
      const buttons = document.querySelectorAll('.nav-btn');
      buttons.forEach(btn => {
        const text = btn.innerText.toLowerCase();
        btn.style.display = text.includes(q) ? 'flex' : 'none';
      });
    }

    const moduleTemplates = {
      'js-properties': () => `
        <div class="space-y-8 animate-pop">
          <!-- Header -->
          <div class="border-b-2 border-[#121212] pb-6">
            <div class="flex flex-wrap items-center gap-2 text-xs mono text-[#52504C] mb-2">
              <span class="px-2 py-0.5 bg-[#121212] text-[#F6F3EB] rounded">FILE 1 & 3</span>
              <span>Properties of JS.md</span>
              <span>•</span>
              <span>Class 1 - Async, Callbacks.md (§1)</span>
            </div>
            <h2 class="serif-title text-4xl lg:text-5xl text-[#121212]">Properties of JavaScript & Runtimes</h2>
            <p class="text-sm lg:text-base text-[#52504C] mt-2 leading-relaxed">
              Every programming language comes with its unique set of architectural trade-offs. JavaScript is an <strong>interpreted, dynamically typed, single-threaded, garbage-collected</strong> language whose capabilities depend on the <strong>runtime environment</strong> executing it.
            </p>
          </div>

          <!-- 4 Pillars Grid -->
          <div class="grid md:grid-cols-2 gap-6">
            <div class="editorial-card p-6 rounded-xl">
              <div class="flex items-center justify-between mb-2">
                <span class="mono text-xs font-bold uppercase px-2 py-0.5 bg-[#121212] text-[#F6F3EB] rounded">Property 01</span>
                <span class="mono text-xs text-[#52504C]">Execution Model</span>
              </div>
              <h3 class="serif-title text-2xl mt-1">1. Interpreted (JIT)</h3>
              <p class="text-xs lg:text-sm text-[#52504C] mt-2 leading-relaxed">
                JavaScript is executed line-by-line at runtime by the JS engine in the browser or server environment, rather than being compiled into ahead-of-time machine code beforehand.
              </p>
              <div class="mt-4 pt-3 border-t border-[#121212]/20 grid grid-cols-2 gap-2 text-xs">
                <div>
                  <strong class="block mono text-[#121212]">✓ Upside:</strong>
                  <span class="text-[#52504C]">One less step before running your code.</span>
                </div>
                <div>
                  <strong class="block mono text-[#121212]">✗ Downsides:</strong>
                  <span class="text-[#52504C]">Performance overhead & more prone to runtime errors.</span>
                </div>
              </div>
            </div>

            <div class="editorial-card p-6 rounded-xl">
              <div class="flex items-center justify-between mb-2">
                <span class="mono text-xs font-bold uppercase px-2 py-0.5 bg-[#121212] text-[#F6F3EB] rounded">Property 02</span>
                <span class="mono text-xs text-[#52504C]">Type System</span>
              </div>
              <h3 class="serif-title text-2xl mt-1">2. Dynamically Typed</h3>
              <p class="text-xs lg:text-sm text-[#52504C] mt-2 leading-relaxed">
                Variables in JavaScript are not bound to a specific data type. Types are determined at runtime and can change as the program executes.
              </p>
              <div class="mt-3 grid grid-cols-2 gap-2 text-[11px] mono">
                <div class="bg-[#F6F3EB] p-2.5 rounded border border-[#121212]">
                  <div class="font-bold mb-1">// C++ (Won't Compile)</div>
                  <code>int a = 1;<br>a = "hello"; // Error!</code>
                </div>
                <div class="bg-[#121212] text-[#F6F3EB] p-2.5 rounded">
                  <div class="font-bold text-[#E6E1D5] mb-1">// JS (Will Compile)</div>
                  <code>var a = 1;<br>a = "harkirat";<br>a = true;</code>
                </div>
              </div>
            </div>

            <div class="editorial-card p-6 rounded-xl">
              <div class="flex items-center justify-between mb-2">
                <span class="mono text-xs font-bold uppercase px-2 py-0.5 bg-[#121212] text-[#F6F3EB] rounded">Property 03</span>
                <span class="mono text-xs text-[#52504C]">CPU Core Usage</span>
              </div>
              <h3 class="serif-title text-2xl mt-1">3. Single-Threaded</h3>
              <p class="text-xs lg:text-sm text-[#52504C] mt-2 leading-relaxed">
                Ordinary JavaScript executes in a single-threaded environment—processing one task at a time on a single Call Stack. A CPU-heavy Node process uses only one core (100%) even on a 12-core machine unless explicit Worker Threads are spawned.
              </p>
            </div>

            <div class="editorial-card p-6 rounded-xl">
              <div class="flex items-center justify-between mb-2">
                <span class="mono text-xs font-bold uppercase px-2 py-0.5 bg-[#121212] text-[#F6F3EB] rounded">Property 04</span>
                <span class="mono text-xs text-[#52504C]">Memory Management</span>
              </div>
              <h3 class="serif-title text-2xl mt-1">4. Garbage Collected</h3>
              <p class="text-xs lg:text-sm text-[#52504C] mt-2 leading-relaxed">
                JavaScript automatically manages memory allocation and deallocation through a Garbage Collector, reclaiming heap memory occupied by objects that are no longer reachable.
              </p>
            </div>
          </div>

          <!-- Interactive Runtime Inspector -->
          <div class="editorial-card p-6 rounded-xl space-y-4">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-[#121212]/20 pb-4">
              <div>
                <span class="text-xs mono uppercase font-bold">§1.1 & §1.2 Interactive Comparison</span>
                <h3 class="serif-title text-2xl">Frontend vs. Backend Runtime & Engine Matrix</h3>
              </div>
              <div class="flex gap-2">
                <button onclick="showRuntimeTab('frontend')" id="rt-frontend" class="editorial-btn px-3 py-1.5 rounded text-xs mono nav-active">Browser (Frontend)</button>
                <button onclick="showRuntimeTab('backend')" id="rt-backend" class="editorial-btn bg-[#F6F3EB] px-3 py-1.5 rounded text-xs mono">Node.js / Bun (Backend)</button>
                <button onclick="showRuntimeTab('engines')" id="rt-engines" class="editorial-btn bg-[#F6F3EB] px-3 py-1.5 rounded text-xs mono">Engine vs Runtime</button>
              </div>
            </div>

            <div id="runtime-display" class="text-sm space-y-3">
              <!-- Populated by showRuntimeTab -->
            </div>
          </div>

          <!-- Conclusion Callout -->
          <div class="editorial-card-sm p-5 rounded-xl bg-[#E6E1D5]">
            <h4 class="font-bold text-sm mono uppercase">📌 Lecture Conclusion: Is JS a good language?</h4>
            <p class="text-xs lg:text-sm text-[#121212] mt-1 leading-relaxed">
              <strong>Yes and no.</strong> It is beginner-friendly and excels at I/O-heavy coordination, but has performance overhead compared to systems languages. Runtimes like <strong>Bun</strong> optimize startup and I/O speed, though raw CPU-bound throughput still belongs to C++, Rust, or Go.
            </p>
          </div>
        </div>
      `,

      'complex-types': () => `
        <div class="space-y-8 animate-pop">
          <div class="border-b-2 border-[#121212] pb-6">
            <div class="flex items-center gap-2 text-xs mono text-[#52504C] mb-2">
              <span class="px-2 py-0.5 bg-[#121212] text-[#F6F3EB] rounded">FILE 4</span>
              <span>Complex types.md</span>
            </div>
            <h2 class="serif-title text-4xl lg:text-5xl">Complex Types: Objects, Arrays & Nested Structures</h2>
            <p class="text-sm lg:text-base text-[#52504C] mt-2">
              Master JavaScript's non-primitive reference types—<code>Objects</code>, <code>Arrays</code>, <code>Array of Objects</code>, and <code>Object of Objects</code>—and test all 5 cohort assignments interactively below.
            </p>
          </div>

          <!-- Reference Cards -->
          <div class="grid md:grid-cols-2 gap-6">
            <div class="editorial-card p-5 rounded-xl space-y-3">
              <h3 class="serif-title text-2xl">1. Objects & Nested Objects</h3>
              <p class="text-xs text-[#52504C]">An object is a collection of <code>key-value pairs</code>, where each key is a string and each value can be any valid JS type (including another object).</p>
              <pre class="bg-[#121212] text-[#F6F3EB] p-3.5 rounded-lg text-xs overflow-x-auto">const user1 = {
  name: "harkirat",
  age: 19,
  address: {
    city: "Delhi",
    country: "India",
    address: "1122 DLF"
  }
};
const city = user1.address.city; // "Delhi"</pre>
            </div>

            <div class="editorial-card p-5 rounded-xl space-y-3">
              <h3 class="serif-title text-2xl">2. Arrays & Array of Objects</h3>
              <p class="text-xs text-[#52504C]">Arrays group ordered data together. Combining arrays with objects models database rows and JSON payloads.</p>
              <pre class="bg-[#121212] text-[#F6F3EB] p-3.5 rounded-lg text-xs overflow-x-auto">const users = [
  { name: "Harkirat", age: 21, gender: "male" },
  { name: "raman", age: 22, gender: "male" },
  { name: "priya", age: 17, gender: "female" }
];
const user1Age = users[0].age; // 21</pre>
            </div>
          </div>

          <!-- Interactive Assignment Workbench -->
          <div class="editorial-card p-6 rounded-xl space-y-5">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-[#121212]/20 pb-4">
              <div>
                <span class="text-xs mono font-bold uppercase">Interactive Assignment Runner</span>
                <h3 class="serif-title text-2xl">Run All 5 Cohort Assignments</h3>
              </div>
              <span class="text-xs mono px-2.5 py-1 bg-[#121212] text-[#F6F3EB] rounded">Click any assignment to execute</span>
            </div>

            <div class="flex flex-wrap gap-2">
              <button onclick="runComplexAssignment(1)" class="editorial-btn bg-[#F6F3EB] px-3 py-1.5 rounded text-xs mono font-medium">#1: Greet User (Name & Age)</button>
              <button onclick="runComplexAssignment(2)" class="editorial-btn bg-[#F6F3EB] px-3 py-1.5 rounded text-xs mono font-medium">#2: Gender Title + Legal Vote (#3)</button>
              <button onclick="runComplexAssignment(3)" class="editorial-btn bg-[#F6F3EB] px-3 py-1.5 rounded text-xs mono font-medium">#4: Filter Even Numbers</button>
              <button onclick="runComplexAssignment(4)" class="editorial-btn bg-[#F6F3EB] px-3 py-1.5 rounded text-xs mono font-medium">#5: Filter Users &gt; 18</button>
              <button onclick="runComplexAssignment(5)" class="editorial-btn bg-[#F6F3EB] px-3 py-1.5 rounded text-xs mono font-medium">#6: Users &gt; 18 &amp;&amp; Male</button>
            </div>

            <div class="grid md:grid-cols-2 gap-4">
              <div>
                <div class="text-xs mono font-bold mb-1">SOLUTION IMPLEMENTATION:</div>
                <pre id="assignment-code" class="bg-[#121212] text-[#F6F3EB] p-4 rounded-lg text-xs overflow-x-auto min-h-[160px]"></pre>
              </div>
              <div>
                <div class="text-xs mono font-bold mb-1">LIVE EXECUTION OUTPUT:</div>
                <div id="assignment-output" class="bg-[#F6F3EB] border-2 border-[#121212] p-4 rounded-lg text-xs mono min-h-[160px] whitespace-pre-wrap"></div>
              </div>
            </div>
          </div>
        </div>
      `,

      'sync-cpu-io': () => `
        <div class="space-y-8 animate-pop">
          <div class="border-b-2 border-[#121212] pb-6">
            <div class="flex items-center gap-2 text-xs mono text-[#52504C] mb-2">
              <span class="px-2 py-0.5 bg-[#121212] text-[#F6F3EB] rounded">FILES 6 & 7</span>
              <span>Synchronous code.md</span>
              <span>•</span>
              <span>I O bound tasks vs CPU bound tasks.md</span>
            </div>
            <h2 class="serif-title text-4xl lg:text-5xl">Synchronous Execution & CPU vs. I/O Bound Tasks</h2>
            <p class="text-sm lg:text-base text-[#52504C] mt-2">
              Synchronous code executes line-by-line in the exact order it is written. Understanding whether a slow operation is <strong>CPU-bound</strong> or <strong>I/O-bound</strong> determines whether asynchronous programming will help.
            </p>
          </div>

          <!-- Synchronous Code Block -->
          <div class="editorial-card p-6 rounded-xl space-y-4">

      };

      const d = diffs[idx];
      container.innerHTML = `
        <div class="bg-[#F6F3EB] border border-[#121212] p-4 rounded-lg space-y-2">
          <div class="font-bold mono text-[#121212]">${d.bugTitle}</div>
          <pre class="text-[11px] overflow-x-auto text-[#52504C]">${d.bugCode}</pre>
        </div>
        <div class="bg-[#121212] text-[#F6F3EB] p-4 rounded-lg space-y-2">
          <div class="font-bold mono text-[#E6E1D5]">${d.fixTitle}</div>
          <pre class="text-[11px] overflow-x-auto">${d.fixCode}</pre>
        </div>
      `;
    }

    // Glossary Data from Lecture 2 §15
    const glossaryTerms = [
      ['Asynchronous programming', 'Start work and handle its result later without blocking the caller.'],
      ['Synchronous programming', 'Each operation completes before the next dependent step proceeds.'],
      ['Callback', 'A function passed to another function for it to invoke at an appropriate point.'],
      ['Callback hell', 'Excessive nesting of callbacks that makes control flow hard to maintain.'],
      ['Promise', 'An object representing the eventual fulfillment or rejection of an async operation.'],
      ['pending / fulfilled / rejected', 'The 3 states of a Promise: waiting, succeeded, or failed.'],
      ['resolve / reject', 'Functions that settle a Promise as fulfilled or rejected.'],
      ['Promise chaining', 'Connecting dependent async steps by returning Promises from .then().'],
      ['Promisification', 'Wrapping a callback-based API inside a Promise-returning function.'],
      ['Microtask', 'High-priority scheduled work (like Promise .then/.catch reactions) processed before timers.'],
      ['I/O-bound vs CPU-bound', 'Waiting on files/network/DB vs spending time doing heavy CPU calculation.'],
      ['Concurrency vs Parallelism', 'Overlapping progress on 1 core (interleaving) vs simultaneous execution on multiple cores.'],
      ['Process vs Thread', 'Isolated OS program instance with its own virtual memory vs an execution path sharing process memory.'],
      ['GIL (Global Interpreter Lock)', 'Lock in conventional CPython limiting simultaneous Python bytecode execution across threads.'],
      ['Future & Executor (Rust)', 'Rust abstraction for a value ready later, driven by an async runtime like Tokio.'],
      ['Race condition', 'Correctness bug where output depends on unpredictable timing of concurrent operations.']
    ];

    function filterGlossary(query = '') {
      const grid = document.getElementById('glossary-grid');
      if (!grid) return;
      const q = query.toLowerCase().trim();
      const filtered = glossaryTerms.filter(([t, d]) => t.toLowerCase().includes(q) || d.toLowerCase().includes(q));
      grid.innerHTML = filtered.map(([term, def]) => `
        <div class="p-3 bg-[#F6F3EB] border border-[#121212] rounded-lg">
          <div class="font-bold mono text-xs text-[#121212]">${term}</div>
          <div class="text-xs text-[#52504C] mt-1">${def}</div>
        </div>
      `).join('');
    }

    // Official 5-Question Quiz from Lecture 1 §13
    const quizQuestions = [
      {
        id: 'q1',
        q: '1. What is the output order of: console.log("A"); setTimeout(() => console.log("B"), 0); console.log("C");',
        options: ['A, B, C', 'A, C, B', 'B, A, C'],
        correct: 1,
        explain: 'setTimeout schedules "B" for later; synchronous code continues and logs "C" before the Call Stack empties.'
      },
      {
        id: 'q2',
        q: '2. What happens if a synchronous while-loop occupies the JS thread for 2 seconds after a 100ms timer is scheduled?',
        options: ['Timer prints before Finished', 'Finished prints before Timer', 'The timer is cancelled'],
        correct: 1,
        explain: 'A timer callback cannot interrupt a running synchronous loop on the Call Stack. "Finished" prints first!'
      },
      {
        id: 'q3',
        q: '3. Does files.forEach(file => fs.writeFile(...)) wait for all file writes to finish before moving to the next line?',
        options: ['Yes, forEach waits', 'No, forEach does not wait for async writes', 'Only when writes finish in order'],
        correct: 1,
        explain: 'forEach iterates synchronously and launches all writes, returning immediately before the disk operations complete.'
      },
      {
        id: 'q4',
        q: '4. In an error-first callback (err, data) => {}, what should happen first?',
        options: ['Use data immediately', 'Check err and handle failure first', 'Call the callback twice'],
        correct: 1,
        explain: 'Always check if (err) first, report/propagate the error, and return early.'
      },
      {
        id: 'q5',
        q: '5. Three independent async file writes (A, B, C) are started in order. Which completion order is guaranteed?',
        options: ['A, then B, then C', 'C, then B, then A', 'Start order does not guarantee completion order'],
        correct: 2,
        explain: 'OS disk scheduling and file sizes vary; completion order is never guaranteed, which is why we use a completion counter!'
      }
    ];

    function renderQuiz() {
      const mount = document.getElementById('quiz-mount');
      if (!mount) return;
      mount.innerHTML = quizQuestions.map((item, idx) => `
        <div class="p-4 bg-[#F6F3EB] border border-[#121212] rounded-xl space-y-2.5">
          <div class="font-semibold text-xs lg:text-sm">${item.q}</div>
          <div class="flex flex-wrap gap-2">
            ${item.options.map((opt, oIdx) => `
              <button onclick="answerQuiz('${item.id}', ${oIdx}, ${item.correct})" class="editorial-btn bg-[#EFECE3] px-3 py-1.5 rounded text-xs mono">
                ${opt}
              </button>
            `).join('')}
          </div>
          <div id="feedback-${item.id}" class="hidden text-xs p-2.5 rounded border border-[#121212] mono"></div>
        </div>
      `).join('');
    }

    function answerQuiz(qId, chosen, correct) {
      const fb = document.getElementById(`feedback-${qId}`);
      const qObj = quizQuestions.find(x => x.id === qId);
      fb.classList.remove('hidden');
      if (chosen === correct) {
        fb.className = 'text-xs p-2.5 rounded bg-[#121212] text-[#F6F3EB] mono';
        fb.innerHTML = `✓ Correct! ${qObj.explain}`;
        appState.quizAnswered[qId] = true;
      } else {
        fb.className = 'text-xs p-2.5 rounded bg-[#E6E1D5] border border-[#121212] text-[#121212] mono';
        fb.innerHTML = `✗ Try again. Hint: ${qObj.explain}`;
      }
      updateMasteryUI();
    }

    function toggleChecklist(key, checked) {
      appState.checklistItems[key] = checked;
      updateMasteryUI();
    }

    // Module Router
    function switchModule(modId) {
      appState.currentModule = modId;
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('nav-active'));
      const activeBtn = document.getElementById(`btn-${modId}`);
      if (activeBtn) activeBtn.classList.add('nav-active');

      const mount = document.getElementById('content-mount');
      mount.innerHTML = moduleTemplates[modId]();

      // Initialize module-specific interactive widgets
      if (modId === 'js-properties') showRuntimeTab('frontend');
      if (modId === 'complex-types') runComplexAssignment(1);
      if (modId === 'event-loop-arch') renderEventLoopState();
      if (modId === 'async-await-gist') showGistFix(1);
      if (modId === 'multithreading-glossary') filterGlossary('');
      if (modId === 'wispr-practice') renderQuiz();

      // Close mobile drawer if open
      const sb = document.getElementById('sidebar');
      if (window.innerWidth < 1024 && !sb.classList.contains('-translate-x-full')) {
        sb.classList.add('-translate-x-full');
      }
    }

    window.onload = function () {
      switchModule('js-properties');
      updateMasteryUI();
    };
  </script>
</body>
</html>
