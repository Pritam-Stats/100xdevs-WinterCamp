<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>100xDevs — Backend, Express, Zod & MongoDB Interactive Companion</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-beige: #F6F3EB;
      --bg-card: #EFECE3;
      --bg-elevated: #E6E1D5;
      --ink-black: #121212;
      --ink-muted: #52504C;
    }

    body {
      background-color: var(--bg-beige);
      color: var(--ink-black);
      font-family: 'Inter', sans-serif;
    }

    .serif-title {
      font-family: 'Instrument Serif', Georgia, serif;
    }

    code, pre, .mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Editorial brutalist-lite borders & shadows */
    .editorial-card {
      background-color: var(--bg-card);
      border: 1.5px solid var(--ink-black);
      box-shadow: 4px 4px 0px var(--ink-black);
    }

    .editorial-card-sm {
      background-color: var(--bg-card);
      border: 1px solid var(--ink-black);
      box-shadow: 2px 2px 0px var(--ink-black);
    }

    .editorial-btn {
      border: 1.5px solid var(--ink-black);
      box-shadow: 2px 2px 0px var(--ink-black);
      transition: all 0.15s ease;
    }

    .editorial-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0px var(--ink-black);
    }

    .editorial-btn:active {
      transform: translate(1px, 1px);
      box-shadow: 0px 0px 0px var(--ink-black);
    }

    .nav-active {
      background-color: var(--ink-black) !important;
      color: var(--bg-beige) !important;
      font-weight: 600;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #EAE5D9;
    }
    ::-webkit-scrollbar-thumb {
      background: #121212;
      border-radius: 3px;
    }

    @keyframes popIn {
      0% { transform: scale(0.97); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop {
      animation: popIn 0.2s ease-out forwards;
    }
  </style>
</head>

<body class="min-h-screen flex flex-col lg:flex-row selection:bg-[#121212] selection:text-[#F6F3EB]">

  <!-- MOBILE HEADER -->
  <header class="lg:hidden flex items-center justify-between px-5 py-4 border-b-2 border-[#121212] bg-[#EFECE3] sticky top-0 z-30">
    <div>
      <span class="text-[11px] mono uppercase tracking-widest px-2 py-0.5 bg-[#121212] text-[#F6F3EB] rounded">100xDevs • Rahul</span>
      <h1 class="serif-title text-2xl leading-none mt-1">Backend, Zod & MongoDB</h1>
    </div>
    <button onclick="toggleMobileMenu()" class="editorial-btn bg-[#F6F3EB] px-3 py-1.5 rounded text-xs mono font-semibold">
      ☰ Modules
    </button>
  </header>

  <!-- LEFT SIDEBAR NAVIGATION -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-80 bg-[#EFECE3] border-r-2 border-[#121212] flex flex-col transform -translate-x-full lg:translate-x-0 lg:static transition-transform duration-200 ease-in-out shrink-0">
    <!-- Brand Header -->
    <div class="p-6 border-b-2 border-[#121212]">
      <div class="flex items-center justify-between">
        <span class="px-2.5 py-0.5 text-[11px] font-bold bg-[#121212] text-[#F6F3EB] rounded-full mono uppercase tracking-wider">100xDevs Cohort</span>
        <span class="text-xs mono text-[#52504C]">Oct 22, 2026</span>
      </div>
      <h1 class="serif-title text-3xl text-[#121212] mt-3 leading-tight">Backend Field Manual</h1>
      <p class="text-xs text-[#52504C] mt-1">Instructor: Rahul • Server Basics, Zod & MongoDB</p>

      <!-- Search Bar -->
      <div class="mt-4 relative">
        <input
          type="text"
          id="topic-search"
          oninput="filterNavigation(this.value)"
          placeholder="Filter modules (e.g. Zod, REST, Pool)..."
          class="w-full bg-[#F6F3EB] border border-[#121212] rounded-lg px-3 py-1.5 text-xs mono placeholder-[#52504C] focus:outline-none focus:ring-2 focus:ring-[#121212]"
        />
      </div>
    </div>

    <!-- Navigation List -->
    <nav class="flex-1 overflow-y-auto p-4 space-y-6" id="nav-container">
      <!-- Part I: Lecture 1 — Server & Express -->
      <div class="nav-group">
        <div class="px-2 pb-1.5 text-[11px] font-bold uppercase tracking-widest text-[#52504C] mono border-b border-[#121212]/20">
          Part I • Servers & REST Networking
        </div>
        <div class="mt-2 space-y-1.5">
          <button onclick="switchModule('servers-npm')" id="btn-servers-npm" class="nav-btn w-full text-left px-3 py-2.5 rounded-lg text-xs font-medium hover:bg-[#E6E1D5] transition flex items-center justify-between">
            <span>1. Servers, Node.js, NPM & Ports</span>
            <span class="mono text-[10px] opacity-70">01</span>
          </button>
          <button onclick="switchModule('rest-networking')" id="btn-rest-networking" class="nav-btn w-full text-left px-3 py-2.5 rounded-lg text-xs font-medium hover:bg-[#E6E1D5] transition flex items-center justify-between">
            <span>2. DNS, REST APIs, Methods & Status</span>
            <span class="mono text-[10px] px-1.5 py-0.5 bg-[#121212]/10 rounded">SIM</span>
          </button>
          <button onclick="switchModule('http-inputs')" id="btn-http-inputs" class="nav-btn w-full text-left px-3 py-2.5 rounded-lg text-xs font-medium hover:bg-[#E6E1D5] transition flex items-center justify-between">
            <span>3. 4 HTTP Inputs (Params, Query, Body)</span>
            <span class="mono text-[10px] px-1.5 py-0.5 bg-[#121212]/10 rounded">LAB</span>
          </button>
          <button onclick="switchModule('notes-crud-sim')" id="btn-notes-crud-sim" class="nav-btn w-full text-left px-3 py-2.5 rounded-lg text-xs font-medium hover:bg-[#E6E1D5] transition flex items-center justify-between">
            <span>4. In-Memory Notes CRUD & Splice</span>
            <span class="mono text-[10px] px-1.5 py-0.5 bg-[#121212]/10 rounded">SIM</span>
          </button>
        </div>
      </div>

      <!-- Part II: Middleware & Zod Validation -->
      <div class="nav-group">
        <div class="px-2 pb-1.5 text-[11px] font-bold uppercase tracking-widest text-[#52504C] mono border-b border-[#121212]/20">
          Part II • Middleware & Zod Contracts
        </div>
        <div class="mt-2 space-y-1.5">
          <button onclick="switchModule('middleware-pipeline')" id="btn-middleware-pipeline" class="nav-btn w-full text-left px-3 py-2.5 rounded-lg text-xs font-medium hover:bg-[#E6E1D5] transition flex items-center justify-between">
            <span>5. Express Middleware Pipeline & next()</span>
            <span class="mono text-[10px] px-1.5 py-0.5 bg-[#121212]/10 rounded">SIM</span>
          </button>
          <button onclick="switchModule('zod-internals')" id="btn-zod-internals" class="nav-btn w-full text-left px-3 py-2.5 rounded-lg text-xs font-medium hover:bg-[#E6E1D5] transition flex items-center justify-between">
            <span>6. Zod Validation & safeParse Engine</span>
            <span class="mono text-[10px] px-1.5 py-0.5 bg-[#121212]/10 rounded">LAB</span>
          </button>
        </div>
      </div>

      <!-- Part III: Persistence, Scaling & MongoDB -->
      <div class="nav-group">
        <div class="px-2 pb-1.5 text-[11px] font-bold uppercase tracking-widest text-[#52504C] mono border-b border-[#121212]/20">
          Part III • Scaling & MongoDB Internals
        </div>
        <div class="mt-2 space-y-1.5">
          <button onclick="switchModule('scaling-persistence')" id="btn-scaling-persistence" class="nav-btn w-full text-left px-3 py-2.5 rounded-lg text-xs font-medium hover:bg-[#E6E1D5] transition flex items-center justify-between">
            <span>7. RAM vs Files & Load Balancer Split-Brain</span>
            <span class="mono text-[10px] px-1.5 py-0.5 bg-[#121212]/10 rounded">SIM</span>
          </button>
          <button onclick="switchModule('mongodb-mongoose')" id="btn-mongodb-mongoose" class="nav-btn w-full text-left px-3 py-2.5 rounded-lg text-xs font-medium hover:bg-[#E6E1D5] transition flex items-center justify-between">
            <span>8. MongoDB Atlas, Mongoose & Pools</span>
            <span class="mono text-[10px] px-1.5 py-0.5 bg-[#121212]/10 rounded">SIM</span>
          </button>
          <button onclick="switchModule('e2e-checkpoints')" id="btn-e2e-checkpoints" class="nav-btn w-full text-left px-3 py-2.5 rounded-lg text-xs font-medium hover:bg-[#E6E1D5] transition flex items-center justify-between">
            <span>9. E2E Todo API & Mastery Checkpoints</span>
            <span class="mono text-[10px] px-1.5 py-0.5 bg-[#121212]/10 rounded">QUIZ</span>
          </button>
        </div>
      </div>
    </nav>

    <!-- Progress Footer -->
    <div class="p-4 border-t-2 border-[#121212] bg-[#E6E1D5]">
      <div class="flex items-center justify-between text-xs mono mb-1.5">
        <span class="font-semibold">MASTERY CHECKLIST</span>
        <span id="mastery-score" class="font-bold">0 / 12</span>
      </div>
      <div class="w-full h-2 bg-[#F6F3EB] border border-[#121212] rounded-full overflow-hidden">
        <div id="mastery-bar" class="h-full bg-[#121212] w-0 transition-all duration-300"></div>
      </div>
    </div>
  </aside>

  <!-- MAIN CONTENT WORKSPACE -->
  <main class="flex-1 overflow-y-auto px-5 py-8 lg:px-14 lg:py-12">
    <div id="content-mount" class="max-w-4xl mx-auto"></div>
  </main>

  <script>
    // Global State
    const appState = {
      currentModule: 'servers-npm',
      quizAnswered: {},
      checklistItems: {
        c1: false, c2: false, c3: false, c4: false, c5: false, c6: false
      },
      memoryNotes: [
        { title: "Learning Node.js", description: "Today I learned how to create an Express server" },
        { title: "Learning HTTP", description: "GET, POST, PUT, PATCH and DELETE requests" }
      ],
      mwStep: 0,
      lbIndex: 0,
      lbLocalStores: { A: [], B: [], C: [] },
      lbSharedDb: [],
      poolActiveCount: 1
    };

    function updateMasteryUI() {
      const quizCount = Object.values(appState.quizAnswered).filter(Boolean).length;
      const checkCount = Object.values(appState.checklistItems).filter(Boolean).length;
      const total = quizCount + checkCount;
      document.getElementById('mastery-score').innerText = `${total} / 12`;
      document.getElementById('mastery-bar').style.width = `${Math.min(100, (total / 12) * 100)}%`;
    }

    function toggleMobileMenu() {
      const sb = document.getElementById('sidebar');
      sb.classList.toggle('-translate-x-full');
    }

    function filterNavigation(query) {
      const q = query.toLowerCase().trim();
      const buttons = document.querySelectorAll('.nav-btn');
      buttons.forEach(btn => {
        const text = btn.innerText.toLowerCase();
        btn.style.display = text.includes(q) ? 'flex' : 'none';
      });
    }

    const moduleTemplates = {
      'servers-npm': () => `
        <div class="space-y-8 animate-pop">
          <div class="border-b-2 border-[#121212] pb-6">
            <div class="flex flex-wrap items-center gap-2 text-xs mono text-[#52504C] mb-2">
              <span class="px-2 py-0.5 bg-[#121212] text-[#F6F3EB] rounded">LECTURE 1 (§1–§5)</span>
              <span>Server Basics</span>
              <span>•</span>
              <span>Node.js, NPM, Express & Ports</span>
            </div>
            <h2 class="serif-title text-4xl lg:text-5xl text-[#121212]">Servers, Node.js, Packages & Network Ports</h2>
            <p class="text-sm lg:text-base text-[#52504C] mt-2 leading-relaxed">
              A <strong>server</strong> is both a software program that listens for client requests and the physical/virtual machine running that program. In this cohort, our backend stack is <strong>JavaScript + Node.js + Express + Zod + MongoDB</strong>.
            </p>
          </div>

          <!-- 3 Analogies Grid -->
          <div class="grid md:grid-cols-3 gap-5">
            <div class="editorial-card p-5 rounded-xl space-y-2">
              <span class="mono text-[11px] font-bold uppercase px-2 py-0.5 bg-[#121212] text-[#F6F3EB] rounded">Analogy 01</span>
              <h3 class="serif-title text-2xl">The Restaurant Kitchen</h3>
              <p class="text-xs text-[#52504C] leading-relaxed">
                <strong>Client</strong> (Browser/Postman) = Customer.<br>
                <strong>API Request</strong> = The Order.<br>
                <strong>Backend</strong> = The Kitchen.<br>
                <strong>Response</strong> = The Prepared Dish.<br>
                The customer doesn't need to know how the kitchen works internally—only the contract to place an order.
              </p>
            </div>

            <div class="editorial-card p-5 rounded-xl space-y-2">
              <span class="mono text-[11px] font-bold uppercase px-2 py-0.5 bg-[#121212] text-[#F6F3EB] rounded">Analogy 02</span>
              <h3 class="serif-title text-2xl">Engine vs. Vehicle</h3>
              <p class="text-xs text-[#52504C] leading-relaxed">
                <strong>V8</strong> is the engine that executes JavaScript.<br>
                <strong>Node.js</strong> is the vehicle built around V8—adding steering, brakes, and controls (file access via <code>fs</code>, networking via <code>http</code>, and background jobs).
              </p>
            </div>

            <div class="editorial-card p-5 rounded-xl space-y-2">
              <span class="mono text-[11px] font-bold uppercase px-2 py-0.5 bg-[#121212] text-[#F6F3EB] rounded">Analogy 03</span>
              <h3 class="serif-title text-2xl">Office Building & Port</h3>
              <p class="text-xs text-[#52504C] leading-relaxed">
                <strong>IP Address</strong> = The street address of an office building.<br>
                <strong>Port</strong> = The specific office room number inside that building (<code>3000</code> for Express, <code>27017</code> for MongoDB, <code>5432</code> for PostgreSQL).
              </p>
            </div>
          </div>

          <!-- NPM & Project Files Explorer -->
          <div class="editorial-card p-6 rounded-xl space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-2 border-b border-[#121212]/20 pb-4">
              <div>
                <span class="text-xs mono uppercase font-bold">§3 Interactive File Inspector</span>
                <h3 class="serif-title text-2xl">NPM & The Recipe Analogy</h3>
              </div>
              <div class="flex flex-wrap gap-2">
                <button onclick="showNpmTab('pkg')" id="npm-btn-pkg" class="editorial-btn px-3 py-1 rounded text-xs mono nav-active">1. package.json</button>
                <button onclick="showNpmTab('lock')" id="npm-btn-lock" class="editorial-btn bg-[#F6F3EB] px-3 py-1 rounded text-xs mono">2. package-lock.json</button>
                <button onclick="showNpmTab('modules')" id="npm-btn-modules" class="editorial-btn bg-[#F6F3EB] px-3 py-1 rounded text-xs mono">3. node_modules/</button>
              </div>
            </div>
            <div id="npm-inspector-box" class="text-xs space-y-3"></div>
          </div>

          <!-- First Express Server & URL Anatomy -->
          <div class="grid md:grid-cols-2 gap-6">
            <div class="editorial-card p-5 rounded-xl space-y-3">
              <h3 class="serif-title text-2xl">Your First Express HTTP Server</h3>
              <p class="text-xs text-[#52504C]">Defining routes does <strong>not</strong> start the server! Without <code>app.listen(3000)</code>, Node never binds to the OS network port.</p>
              <pre class="bg-[#121212] text-[#F6F3EB] p-3.5 rounded-lg text-xs overflow-x-auto">const express = require("express");
const app = express();

app.get("/", (req, res) => {
  res.send("Hello World!");
});

app.get("/about", (req, res) => {
  res.send("This is my first backend application");
});

// Starts listening for TCP connections on port 3000
app.listen(3000, () => {
  console.log("Server running at http://localhost:3000");
});</pre>
            </div>

            <div class="editorial-card p-5 rounded-xl space-y-3">
              <h3 class="serif-title text-2xl">Anatomy of a Localhost URL & Default Ports</h3>
              <div class="bg-[#121212] text-[#F6F3EB] p-3 rounded-lg text-xs mono">
                <span class="text-amber-300">http://</span><span class="text-emerald-300">localhost</span>:<span class="text-sky-300">3000</span><span class="text-rose-300">/about</span>
              </div>
              <ul class="text-xs text-[#52504C] space-y-1.5">
                <li>• <code>http://</code> — Protocol / scheme</li>
                <li>• <code>localhost</code> — Hostname referring to your own machine (<code>127.0.0.1</code>)</li>
                <li>• <code>3000</code> — Logical Port endpoint</li>
                <li>• <code>/about</code> — Route Path</li>
              </ul>
              <div class="pt-2 border-t border-[#121212]/20 grid grid-cols-2 gap-2 text-[11px] mono">
                <div class="p-2 bg-[#F6F3EB] border border-[#121212] rounded">HTTP: <strong>80</strong> | HTTPS: <strong>443</strong></div>
                <div class="p-2 bg-[#F6F3EB] border border-[#121212] rounded">MongoDB: <strong>27017</strong> | PG: <strong>5432</strong></div>
              </div>
            </div>
          </div>
        </div>
      `,

      'rest-networking': () => `
        <div class="space-y-8 animate-pop">
          <div class="border-b-2 border-[#121212] pb-6">
            <div class="flex items-center gap-2 text-xs mono text-[#52504C] mb-2">
              <span class="px-2 py-0.5 bg-[#121212] text-[#F6F3EB] rounded">LECTURE 1 (§6–§10)</span>
              <span>DNS, Request-Response Cycle, REST API & Status Codes</span>
            </div>
            <h2 class="serif-title text-4xl lg:text-5xl">How REST APIs & HTTP Networking Work Internally</h2>
            <p class="text-sm lg:text-base text-[#52504C] mt-2 leading-relaxed">
              <strong>HTTP</strong> is the communication protocol; <strong>REST (Representational State Transfer)</strong> is an architectural style on top of HTTP that identifies resources via URLs and uses standard HTTP methods and status codes consistently.
            </p>
          </div>

          <!-- Interactive 7-Step Packet Tracer -->
          <div class="editorial-card p-6 rounded-xl space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-2 border-b border-[#121212]/20 pb-4">
              <div>
                <span class="text-xs mono uppercase font-bold">§7 Interactive Network Packet Journey</span>
                <h3 class="serif-title text-2xl">What Happens When a Browser Reaches Your Server?</h3>
              </div>
              <div class="flex gap-2">
                <button onclick="stepNetworkJourney()" class="editorial-btn bg-[#121212] text-[#F6F3EB] px-3.5 py-1.5 rounded text-xs mono font-semibold">▶ Next Network Hop</button>
                <button onclick="resetNetworkJourney()" class="editorial-btn bg-[#F6F3EB] px-3 py-1.5 rounded text-xs mono">↺ Reset</button>
              </div>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-7 gap-2 text-[11px] mono" id="net-steps-grid"></div>
            <div id="net-step-detail" class="p-4 bg-[#F6F3EB] border-2 border-[#121212] rounded-lg text-xs leading-relaxed">
              Click <strong>"▶ Next Network Hop"</strong> to trace a request from URL bar to DNS, TCP/TLS, Express routing, and back.
            </div>
          </div>

          <!-- HTTP Methods & Idempotency Table -->
          <div class="editorial-card overflow-hidden rounded-xl">
            <div class="p-4 bg-[#121212] text-[#F6F3EB] flex justify-between items-center">
              <span class="mono text-xs font-bold uppercase">HTTP Methods, CRUD Mapping & Idempotency Semantics</span>
              <span class="mono text-xs text-[#E6E1D5]">Lecture 1 §8–§9</span>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse text-xs">
                <thead>
                  <tr class="border-b-2 border-[#121212] bg-[#E6E1D5] mono">
                    <th class="p-3">HTTP Method</th>
                    <th class="p-3">CRUD Action</th>
                    <th class="p-3">Endpoint Example</th>
                    <th class="p-3">Idempotent?</th>
                    <th class="p-3">Internal Behavior</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-[#121212]/20">
                  <tr>
                    <td class="p-3 font-bold mono">GET</td>
                    <td class="p-3">Read</td>
                    <td class="p-3 mono">/notes or /notes/1</td>
                    <td class="p-3 font-bold text-emerald-800 mono">YES</td>
                    <td class="p-3">Retrieves representation; must never mutate server state.</td>
                  </tr>
                  <tr>
                    <td class="p-3 font-bold mono">POST</td>
                    <td class="p-3">Create</td>
                    <td class="p-3 mono">/notes</td>
                    <td class="p-3 font-bold text-rose-800 mono">NO</td>
                    <td class="p-3">Submits new payload. Repeating 5 times creates 5 distinct notes!</td>
                  </tr>
                  <tr>
                    <td class="p-3 font-bold mono">PUT</td>
                    <td class="p-3">Update (Replace)</td>
                    <td class="p-3 mono">/notes/1</td>
                    <td class="p-3 font-bold text-emerald-800 mono">YES</td>
                    <td class="p-3">Replaces the entire target resource representation at <code>/notes/1</code>.</td>
                  </tr>
                  <tr>
                    <td class="p-3 font-bold mono">PATCH</td>
                    <td class="p-3">Update (Partial)</td>
                    <td class="p-3 mono">/notes/1</td>
                    <td class="p-3 font-bold text-amber-800 mono">Context-Dependent</td>
                    <td class="p-3">Modifies only selected fields (e.g. updating <code>description</code> only).</td>
                  </tr>
                  <tr>
                    <td class="p-3 font-bold mono">DELETE</td>
                    <td class="p-3">Delete</td>
                    <td class="p-3 mono">/notes/1</td>
                    <td class="p-3 font-bold text-emerald-800 mono">YES</td>
                    <td class="p-3">Removes target resource. Repeating leaves the server in the same state (deleted).</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

          <!-- Interactive Status Code Explorer -->
          <div class="editorial-card p-6 rounded-xl space-y-4">
            <h3 class="serif-title text-2xl">Interactive HTTP Status Code Explorer ("The Headline of the Server's Answer")</h3>
            <div class="flex flex-wrap gap-2 text-xs mono">
              <button onclick="showStatusDetail('200')" class="editorial-btn bg-[#F6F3EB] px-3 py-1.5 rounded font-bold">200 OK</button>

const { z } = require("zod");

const app = express();
app.use(express.json());

const createTodoSchema = z.object({
  title: z.string().trim().min(1).max(30),
  description: z.string().trim().max(100).default("")
});

const updateTodoSchema = z.object({
  title: z.string().trim().min(1).max(30).optional(),
  description: z.string().trim().max(100).optional(),
  completed: z.boolean().optional()
}).refine((val) => Object.keys(val).length > 0, {
  message: "Provide at least one field to update"
});

const todoSchema = new mongoose.Schema({
  title: { type: String, required: true, trim: true, maxlength: 30 },
  description: { type: String, default: "", maxlength: 100 },
  completed: { type: Boolean, default: false }
}, { timestamps: true });

const Todo = mongoose.model("Todo", todoSchema);

app.post("/todos", async (req, res, next) => {
  const parsed = createTodoSchema.safeParse(req.body);
  if (!parsed.success) {
    return res.status(400).json({
      message: "Validation failed",
      errors: parsed.error.issues.map(i => ({ field: i.path.join("."), message: i.message }))
    });
  }
  try {
    const todo = await Todo.create(parsed.data);
    return res.status(201).json(todo);
  } catch (err) {
    return next(err);
  }
});

app.patch("/todos/:id", async (req, res, next) => {
  if (!mongoose.isValidObjectId(req.params.id)) {
    return res.status(400).json({ message: "Invalid todo ID" });
  }
  const parsed = updateTodoSchema.safeParse(req.body);
  if (!parsed.success) {
    return res.status(400).json({ message: "Validation failed", errors: parsed.error.issues });
  }
  try {
    const todo = await Todo.findByIdAndUpdate(
      req.params.id,
      { $set: parsed.data },
      { new: true, runValidators: true }
    );
    if (!todo) return res.status(404).json({ message: "Todo not found" });
    return res.json(todo);
  } catch (err) {
    return next(err);
  }
});

// Centralized Error Handler (Registered after all routes)
app.use((error, req, res, next) => {
  console.error(error);
  if (res.headersSent) return next(error);
  return res.status(500).json({ message: "Internal server error" });
});</pre>

      highlight(2);

      if (!callNext) {
        out.innerHTML = '⚠️ <strong>REQUEST HUNG AT STATION 2 (Logger Middleware):</strong> Neither <code>next()</code> nor <code>res.send()</code> was called! The client is left waiting indefinitely.';
        return;
      }

      highlight(3);
      if (!Number.isFinite(age) || age < 18) {
        out.innerHTML = '🛑 <strong>BLOCKED AT STATION 3 (checkAge Guard):</strong> Returned <code>403 Forbidden: { "message": "You must be at least 18 years old" }</code>. Route handler (#4) never ran!';
        return;
      }

      highlight(4);
      out.innerHTML = '✓ <strong>200 OK (Reached Station 4 Route Handler):</strong> Passed all middleware checks! Response: <code>{ "message": "Welcome to the restricted page" }</code>';
    }

    // Module 6: Live Zod safeParse Engine
    function loadZodPreset(type) {
      const presets = {
        valid: '{\n  "title": "   Revise JavaScript   ",\n  "description": "Practice promises and Zod",\n  "isAdmin": true\n}',
        badTypes: '{\n  "title": 123,\n  "description": false\n}',
        whitespace: '{\n  "title": "   ",\n  "description": "Valid description"\n}',
        empty: '{}'
      };
      document.getElementById('zod-live-input').value = presets[type];
      evaluateLiveZod();
    }

    function evaluateLiveZod() {
      const inputEl = document.getElementById('zod-live-input');
      const resEl = document.getElementById('zod-live-result');
      const badgeEl = document.getElementById('zod-http-badge');
      const isStrict = document.getElementById('zod-strict-toggle').checked;
      if (!inputEl || !resEl) return;

      let parsedJson;
      try {
        parsedJson = JSON.parse(inputEl.value);
      } catch (err) {
        resEl.innerText = '// Express express.json() failed before Zod even ran!\nSyntaxError: ' + err.message;
        badgeEl.innerText = 'HTTP 400 Bad Request — Malformed JSON syntax';
        return;
      }

      if (typeof parsedJson !== 'object' || parsedJson === null || Array.isArray(parsedJson)) {
        resEl.innerText = JSON.stringify({
          success: false,
          error: { issues: [{ code: "invalid_type", expected: "object", path: [], message: "Expected object" }] }
        }, null, 2);
        badgeEl.innerText = 'HTTP 400 Bad Request — Expected JSON object';
        return;
      }

      const issues = [];
      const allowedKeys = ['title', 'description'];
      const extraKeys = Object.keys(parsedJson).filter(k => !allowedKeys.includes(k));

      if (isStrict && extraKeys.length > 0) {
        issues.push({
          code: "unrecognized_keys",
          keys: extraKeys,
          path: [],
          message: "Unrecognized key(s) in object: " + extraKeys.map(k => "'" + k + "'").join(", ")
        });
      }

      // Validate title
      if (parsedJson.title === undefined) {
        issues.push({ code: "invalid_type", expected: "string", received: "undefined", path: ["title"], message: "Required" });
      } else if (typeof parsedJson.title !== "string") {
        issues.push({ code: "invalid_type", expected: "string", received: typeof parsedJson.title, path: ["title"], message: "Expected string, received " + typeof parsedJson.title });
      } else {
        const trimmedTitle = parsedJson.title.trim();
        if (trimmedTitle.length < 1) {
          issues.push({ code: "too_small", minimum: 1, type: "string", path: ["title"], message: "String must contain at least 1 character(s) after .trim()" });
        } else if (trimmedTitle.length > 30) {
          issues.push({ code: "too_big", maximum: 30, type: "string", path: ["title"], message: "String must contain at most 30 character(s)" });
        }
      }

      // Validate description
      if (parsedJson.description === undefined) {
        issues.push({ code: "invalid_type", expected: "string", received: "undefined", path: ["description"], message: "Required" });
      } else if (typeof parsedJson.description !== "string") {
        issues.push({ code: "invalid_type", expected: "string", received: typeof parsedJson.description, path: ["description"], message: "Expected string, received " + typeof parsedJson.description });
      } else {
        const trimmedDesc = parsedJson.description.trim();
        if (trimmedDesc.length < 1) {
          issues.push({ code: "too_small", minimum: 1, type: "string", path: ["description"], message: "String must contain at least 1 character(s) after .trim()" });
        } else if (trimmedDesc.length > 100) {
          issues.push({ code: "too_big", maximum: 100, type: "string", path: ["description"], message: "String must contain at most 100 character(s)" });
        }
      }

      if (issues.length > 0) {
        const out = { success: false, error: { issues } };
        resEl.innerText = JSON.stringify(out, null, 2);
        badgeEl.innerHTML = '🛑 <strong>HTTP 400 Bad Request</strong> — Validation failed! MongoDB is NOT called.';
      } else {
        const sanitized = {
          title: parsedJson.title.trim(),
          description: parsedJson.description.trim()
        };
        const out = { success: true, data: sanitized };
        resEl.innerText = JSON.stringify(out, null, 2);
        const stripNote = extraKeys.length > 0 ? ' (Stripped unknown keys: ' + extraKeys.join(', ') + ')' : '';
        badgeEl.innerHTML = '✓ <strong>Validation Succeeded!</strong> Pass <code>result.data</code> to <code>Todo.create()</code>' + stripNote + '.';
      }
    }

    // Module 7: Load Balancer Split-Brain Simulator
    function simClusterRequest(storageMode, method) {
      const instances = ['A', 'B', 'C'];
      const target = instances[appState.lbIndex % 3];
      appState.lbIndex++;
      const nextTarget = instances[appState.lbIndex % 3];

      instances.forEach(id => {
        document.getElementById(`inst-box-${id}`).className = 'p-4 bg-[#F6F3EB] border-2 border-[#121212] rounded-xl space-y-1.5';
        document.getElementById(`inst-tag-${id}`).innerText = 'Idle';
      });

      document.getElementById(`inst-box-${target}`).className = 'p-4 bg-[#E6E1D5] border-2 border-[#121212] shadow-[4px_4px_0px_#121212] rounded-xl space-y-1.5';
      document.getElementById(`inst-tag-${target}`).innerText = `← Handled ${method}`;

      const narration = document.getElementById('cluster-narration');

      if (storageMode === 'file') {
        if (method === 'POST') {
          const newTodo = `Todo#${appState.lbIndex}`;
          appState.lbLocalStores[target].push(newTodo);
          document.getElementById(`inst-file-${target}`).innerText = `${target}'s todos.json: ${JSON.stringify(appState.lbLocalStores[target])}`;
          narration.innerText = `[Round-Robin -> Instance ${target}] Wrote "${newTodo}" ONLY to Instance ${target}'s local disk! Instances ${instances.filter(x => x !== target).join(' & ')} do NOT have it. (Next hop: Instance ${nextTarget})`;
        } else {
          const data = appState.lbLocalStores[target];
          narration.innerText = `[Round-Robin -> Instance ${target}] Client requested GET /todos from Instance ${target} -> Returned ${JSON.stringify(data)}! Split-Brain bug: data written to other instances is missing here!`;
        }
      } else {
        const newTodo = `Todo#${appState.lbIndex}`;
        appState.lbSharedDb.push(newTodo);
        document.getElementById('shared-db-view').innerText = `${JSON.stringify(appState.lbSharedDb)} (${appState.lbSharedDb.length} documents)`;
        narration.innerText = `[Round-Robin -> Instance ${target}] Instance ${target} wrote "${newTodo}" to Shared MongoDB! Every instance (A, B, C) now sees the exact same source of truth.`;
      }
    }

    function resetClusterSim() {
      appState.lbIndex = 0;
      appState.lbLocalStores = { A: [], B: [], C: [] };
      appState.lbSharedDb = [];
      ['A', 'B', 'C'].forEach(id => {
        document.getElementById(`inst-file-${id}`).innerText = `${id}'s todos.json: []`;
        document.getElementById(`inst-tag-${id}`).innerText = 'Ready';
        document.getElementById(`inst-box-${id}`).className = 'p-4 bg-[#F6F3EB] border-2 border-[#121212] rounded-xl space-y-1.5';
      });
      document.getElementById('shared-db-view').innerText = '[ ] (0 documents)';
      document.getElementById('cluster-narration').innerText = 'Load Balancer Next Target: Instance A';
    }

    // Module 8: Connection Pool Visualizer
    const poolState = [true, false, false, false, false];
    function renderPoolCounters() {
      const grid = document.getElementById('pool-counters-grid');
      if (!grid) return;
      grid.innerHTML = poolState.map((busy, idx) => `
        <div class="p-3 rounded-lg border border-[#121212] text-center ${busy ? 'bg-[#121212] text-[#F6F3EB]' : 'bg-[#F6F3EB] text-[#121212]'}">
          <div class="font-bold">Socket #${idx + 1}</div>
          <div class="text-[10px] mt-1">${busy ? '⚡ Executing Query' : '✓ Warm & Idle'}</div>
        </div>
      `).join('');
    }

    function firePoolQuery() {
      const freeIdx = poolState.findIndex(b => !b);
      const targetIdx = freeIdx !== -1 ? freeIdx : Math.floor(Math.random() * 5);
      poolState[targetIdx] = true;
      renderPoolCounters();
      setTimeout(() => {
        poolState[targetIdx] = false;
        renderPoolCounters();
      }, 900);
    }

    // Module 9: Official 6-Question Checkpoint Quiz
    const quizQuestions = [
      {
        id: 'q1',
        q: '1. What happens if you define app.get("/", ...) in Express, but forget to call app.listen(3000)?',
        options: ['It defaults to port 80', 'Routes are defined, but the server never listens for network connections', 'Express throws a syntax error'],
        correct: 1,
        explain: 'Defining routes only registers handlers in memory; app.listen() starts the actual TCP/HTTP listener.'
      },
      {
        id: 'q2',
        q: '2. Why might req.body be undefined in an Express POST route even when Postman sent valid JSON?',
        options: ['app.use(express.json()) middleware was not registered before the route', 'POST requests cannot have a body', 'Port 3000 blocks JSON'],
        correct: 0,
        explain: 'Express does not parse JSON request bodies by default; you must register app.use(express.json()) prior to your routes.'
      },
      {
        id: 'q3',
        q: '3. Why should you use notes.splice(index, 1) instead of delete notes[index] when deleting from an in-memory array?',
        options: ['delete is a syntax error in Node.js', 'delete leaves an empty slot (null in JSON) and does not update array length', 'splice automatically saves to MongoDB'],
        correct: 1,
        explain: 'The delete operator removes the property but leaves a sparse hole (null in JSON) with unchanged array length; splice() shifts elements and shrinks the array.'
      },
      {
        id: 'q4',
        q: '4. What does createTodoSchema.safeParse(req.body) return when validation fails?',
        options: ['It throws an unhandled exception that crashes Express', 'It returns { success: false, error: ZodError } without throwing', 'It returns { success: false, data: req.body }'],
        correct: 1,
        explain: 'safeParse() returns a discriminated union: either { success: true, data } or { success: false, error }, avoiding exceptions for ordinary validation failures.'
      },
      {
        id: 'q5',
        q: '5. Why does storing data in a local todos.json file fail when you scale horizontally to 3 servers behind a load balancer?',
        options: ['JSON files cannot store booleans', 'Each server instance has its own separate local filesystem, causing inconsistent/stale reads', 'Load balancers delete local files'],
        correct: 1,
        explain: 'Like three receptionists with separate notebooks, a write to Server A\'s local file is invisible when the load balancer routes the next read to Server B.'
      },
      {
        id: 'q6',
        q: '6. What is the bug in calling Todo.create(parsed.data); res.status(201).json({ message: "Created" }); without await?',
        options: ['Express responds 201 Created before knowing if the database insert succeeded or failed', 'Mongoose runs synchronously by default', 'It deletes the collection'],
        correct: 0,
        explain: 'Todo.create() returns a Promise. Without await, the route immediately sends 201 Created even if the database write fails moments later.'
      }
    ];

    function renderQuiz() {
      const mount = document.getElementById('quiz-mount');
      if (!mount) return;
      mount.innerHTML = quizQuestions.map((item) => `
        <div class="p-4 bg-[#F6F3EB] border border-[#121212] rounded-xl space-y-2.5">
          <div class="font-semibold text-xs lg:text-sm">${item.q}</div>
          <div class="flex flex-wrap gap-2">
            ${item.options.map((opt, oIdx) => `
              <button onclick="answerQuiz('${item.id}', ${oIdx}, ${item.correct})" class="editorial-btn bg-[#EFECE3] px-3 py-1.5 rounded text-xs mono text-left">
                ${opt}
              </button>
            `).join('')}
          </div>
          <div id="feedback-${item.id}" class="hidden text-xs p-2.5 rounded border border-[#121212] mono"></div>
        </div>
      `).join('');
    }

    function answerQuiz(qId, chosen, correct) {
      const fb = document.getElementById(`feedback-${qId}`);
      const qObj = quizQuestions.find(x => x.id === qId);
      fb.classList.remove('hidden');
      if (chosen === correct) {
        fb.className = 'text-xs p-2.5 rounded bg-[#121212] text-[#F6F3EB] mono';
        fb.innerHTML = `✓ Correct! ${qObj.explain}`;
        appState.quizAnswered[qId] = true;
      } else {
        fb.className = 'text-xs p-2.5 rounded bg-[#E6E1D5] border border-[#121212] text-[#121212] mono';
        fb.innerHTML = `✗ Try again. Hint: ${qObj.explain}`;
      }
      updateMasteryUI();
    }

    function toggleChecklist(key, checked) {
      appState.checklistItems[key] = checked;
      updateMasteryUI();
    }

    // Module Router
    function switchModule(modId) {
      appState.currentModule = modId;
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('nav-active'));
      const activeBtn = document.getElementById(`btn-${modId}`);
      if (activeBtn) activeBtn.classList.add('nav-active');

      const mount = document.getElementById('content-mount');
      mount.innerHTML = moduleTemplates[modId]();

      // Initialize module-specific interactive labs
      if (modId === 'servers-npm') showNpmTab('pkg');
      if (modId === 'rest-networking') { renderNetworkSteps(); showStatusDetail('200'); }
      if (modId === 'http-inputs') updateRequestDissector();
      if (modId === 'notes-crud-sim') renderRamState();
      if (modId === 'zod-internals') loadZodPreset('valid');
      if (modId === 'mongodb-mongoose') renderPoolCounters();
      if (modId === 'e2e-checkpoints') renderQuiz();

      // Close mobile drawer if open
      const sb = document.getElementById('sidebar');
      if (window.innerWidth < 1024 && !sb.classList.contains('-translate-x-full')) {
        sb.classList.add('-translate-x-full');
      }
    }

    window.onload = function () {
      switchModule('servers-npm');
      updateMasteryUI();
    };
  </script>
